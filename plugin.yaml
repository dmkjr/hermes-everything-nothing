# Stable runtime ID: enabled entries, settings, hooks and API routes use next-prompt.
# Everything Nothing is the display brand; renaming this ID requires a data migration.
name: next-prompt
version: 0.5.0
manifest_version: 2
api_version: 1
description: "Inline reply suggestions in the Desktop composer: ranked choices, follow-up options, and a reply-style concision setting."
author: SiteKings
license: MIT
homepage: https://github.com/dmkjr/hermes-everything-nothing
requires_hermes: ">=0.21"
tags: [desktop, productivity, composer, suggestions]
provides_hooks:
  - pre_llm_call
  - post_llm_call
  - post_compaction
provides_tools: []
config_schema:
  enabled:
    type: bool
    default: true
    description: "Enable or disable next-prompt suggestions"
  max_context_messages:
    type: int
    default: 8
    description: "Context size in messages: your last N/2 requests plus the agent's final reply to each (2-10)"
  cooldown_seconds:
    type: int
    default: 3
    description: "Minimum seconds between suggestions to avoid spamming"
  local_fallback:
    type: bool
    default: true
    description: "Offer detected choices or a clarification when the suggestion model fails"
  offer_follow_up_options:
    type: bool
    default: true
    description: "Offer multiple follow-up questions when Hermes did not offer choices"
  local_explicit_choices:
    type: bool
    default: false
    description: "Show choices already offered by Hermes without an extra model call"
  response_concision:
    type: int
    default: 0
    description: "Reply style for interactive chats (0 off, 1 light, 2 terse, 3 Fluff Eater)"
